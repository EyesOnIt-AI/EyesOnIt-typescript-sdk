name: Bug report
description: Report a TypeScript SDK defect.
title: "[TypeScript SDK Bug]: "
labels: ["bug", "typescript-sdk"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and package version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction steps

